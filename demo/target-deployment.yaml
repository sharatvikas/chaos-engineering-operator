# Demo target: 4 nginx replicas the chaos operator will kill and watch self-heal.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-target
  namespace: chaos-demo
  labels:
    app: demo-target
spec:
  replicas: 4
  selector:
    matchLabels:
      app: demo-target
  template:
    metadata:
      labels:
        app: demo-target
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: nginx
          image: registry.k8s.io/nginx-slim:0.27
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
