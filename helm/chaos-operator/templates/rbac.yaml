{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "chaos-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chaos-operator.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

---
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "chaos-operator.fullname" . }}-manager
  labels:
    {{- include "chaos-operator.labels" . | nindent 4 }}
rules:
  # ChaosExperiment CRDs
  - apiGroups: ["chaos.sharatvikas.io"]
    resources: ["chaosexperiments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["chaos.sharatvikas.io"]
    resources: ["chaosexperiments/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["chaos.sharatvikas.io"]
    resources: ["chaosexperiments/finalizers"]
    verbs: ["update"]

  # Pod operations — kill, read status, exec (for tc-netem sidecar injection)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  # Node listing — for node-level fault selection
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]

  # Deployment / DaemonSet / StatefulSet — for reading workload metadata
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]

  # Events — for recording experiment lifecycle events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

  # ConfigMaps + Secrets — for storing experiment state and reading credentials
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]

  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "chaos-operator.fullname" . }}-manager
  labels:
    {{- include "chaos-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "chaos-operator.fullname" . }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "chaos-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

---
{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "chaos-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chaos-operator.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "chaos-operator.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      path: /metrics
{{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chaos-operator.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chaos-operator.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "chaos-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
