apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: chaosexperiments.chaos.sharatvikas.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: chaos.sharatvikas.io
  names:
    kind: ChaosExperiment
    listKind: ChaosExperimentList
    plural: chaosexperiments
    singular: chaosexperiment
    shortNames:
      - chaos
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Fault
          type: string
          jsonPath: .spec.fault.type
        - name: Duration
          type: string
          jsonPath: .spec.duration
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["target", "fault", "duration"]
              properties:
                target:
                  type: object
                  required: ["selector", "namespace"]
                  properties:
                    selector:
                      type: object
                      description: Standard Kubernetes label selector for target pods.
                      properties:
                        matchLabels:
                          type: object
                          additionalProperties:
                            type: string
                        matchExpressions:
                          type: array
                          items:
                            type: object
                            required: ["key", "operator"]
                            properties:
                              key:
                                type: string
                              operator:
                                type: string
                              values:
                                type: array
                                items:
                                  type: string
                    namespace:
                      type: string
                      default: default
                    percentage:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 50
                    mode:
                      type: string
                      enum: ["Random", "All", "Fixed"]
                      default: Random
                    minHealthyReplicas:
                      type: integer
                      minimum: 0
                      description: >
                        Preflight guard — block the experiment if injecting the
                        fault would leave fewer than this many running,
                        unaffected pods. 0 disables the guard.
                fault:
                  type: object
                  required: ["type"]
                  properties:
                    type:
                      type: string
                      enum:
                        - PodKill
                        - ContainerKill
                        - NetworkDelay
                        - NetworkPartition
                        - CPUStress
                        - MemoryStress
                        - DNSFailure
                        - DiskFill
                        - NodeDrain
                    podKill:
                      type: object
                      properties:
                        gracePeriodSeconds:
                          type: integer
                          format: int64
                          minimum: 0
                          default: 0
                    containerKill:
                      type: object
                      properties:
                        containerName:
                          type: string
                        signal:
                          type: string
                          enum: ["SIGKILL", "SIGTERM"]
                          default: SIGKILL
                    networkDelay:
                      type: object
                      required: ["latencyMs"]
                      properties:
                        latencyMs:
                          type: integer
                          minimum: 1
                        jitterMs:
                          type: integer
                        correlationPct:
                          type: integer
                    networkPartition:
                      type: object
                      properties:
                        direction:
                          type: string
                          enum: ["Egress", "Ingress", "Both"]
                          default: Both
                        peerCIDRs:
                          type: array
                          items:
                            type: string
                    cpuStress:
                      type: object
                      required: ["cores", "load"]
                      properties:
                        cores:
                          type: integer
                          minimum: 1
                        load:
                          type: integer
                          minimum: 1
                          maximum: 100
                    memoryStress:
                      type: object
                      required: ["memoryMB"]
                      properties:
                        memoryMB:
                          type: integer
                          minimum: 64
                        fillPercentage:
                          type: integer
                          maximum: 95
                duration:
                  type: string
                  pattern: '^[0-9]+(s|m|h)$'
                cooldown:
                  type: string
                  pattern: '^[0-9]+(s|m|h)$'
                  default: "2m"
                dryRun:
                  type: boolean
                  default: false
                safetyGates:
                  type: array
                  items:
                    type: object
                    required: ["type", "threshold"]
                    properties:
                      type:
                        type: string
                        enum: ["SLOBurnRate", "ErrorRate", "Availability"]
                      service:
                        type: string
                      threshold:
                        type: string
                      prometheusQuery:
                        type: string
                schedule:
                  type: object
                  required: ["cron"]
                  properties:
                    cron:
                      type: string
                    timezone:
                      type: string
                      default: UTC
                    suspend:
                      type: boolean
                notifications:
                  type: object
                  properties:
                    slack:
                      type: string
                    pagerduty:
                      type: boolean
            status:
              type: object
              properties:
                phase:
                  type: string
                startTime:
                  type: string
                  format: date-time
                endTime:
                  type: string
                  format: date-time
                targetedPods:
                  type: array
                  items:
                    type: string
                abortReason:
                  type: string
                blockedReason:
                  type: string
                dryRunReport:
                  type: string
                report:
                  type: string
                lastScheduledTime:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    required: ["type", "status", "lastTransitionTime", "reason", "message"]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
